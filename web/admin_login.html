<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login - SIGARRA Assistant</title>
    <link rel="stylesheet" href="/web/styles.css" />
    <style>
      .admin-login-container {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .login-box {
        background: white;
        padding: 40px;
        border-radius: 8px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        width: 100%;
        max-width: 400px;
      }
      .login-box h1 {
        margin: 0 0 10px 0;
        font-size: 28px;
        color: #333;
        text-align: center;
      }
      .login-box p {
        margin: 0 0 30px 0;
        color: #666;
        text-align: center;
        font-size: 14px;
      }
      .form-group {
        margin-bottom: 20px;
      }
      .form-group label {
        display: block;
        margin-bottom: 8px;
        color: #333;
        font-weight: 500;
        font-size: 14px;
      }
      .form-group input {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-size: 14px;
        box-sizing: border-box;
        transition: border-color 0.2s;
      }
      .form-group input:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      }
      .submit-btn {
        width: 100%;
        padding: 10px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 4px;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
        transition: opacity 0.2s;
      }
      .submit-btn:hover {
        opacity: 0.9;
      }
      .submit-btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .error-message {
        margin-bottom: 20px;
        padding: 12px;
        background: #fee;
        border: 1px solid #fcc;
        border-radius: 4px;
        color: #c33;
        font-size: 14px;
        text-align: center;
        display: none;
      }
      .back-link {
        text-align: center;
        margin-top: 20px;
      }
      .back-link a {
        color: #667eea;
        text-decoration: none;
        font-size: 14px;
      }
      .back-link a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="admin-login-container">
      <div class="login-box">
        <h1>🔒 Admin</h1>
        <p>Acesso restrito - Digite a password para continuar</p>
        
        <div id="error-message" class="error-message"></div>
        
        <form id="login-form">
          <div class="form-group">
            <label for="password">Password:</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Digite a password"
              required
              autocomplete="current-password"
            />
          </div>
          
          <button type="submit" id="submit-btn" class="submit-btn">
            Entrar
          </button>
        </form>
        
        <div class="back-link">
          <a href="/">← Voltar ao chat</a>
        </div>
      </div>
    </div>

    <script>
      const form = document.getElementById('login-form');
      const passwordInput = document.getElementById('password');
      const submitBtn = document.getElementById('submit-btn');
      const errorMessage = document.getElementById('error-message');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const password = passwordInput.value.trim();
        if (!password) {
          showError('Digite a password');
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Entrando...';
        errorMessage.style.display = 'none';

        try {
          const res = await fetch('/api/admin/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: 'admin', password }),
          });

          if (res.ok) {
            // Login bem-sucedido, redirecionar para admin
            window.location.href = '/admin';
          } else if (res.status === 401) {
            showError('Password incorreta');
          } else {
            showError('Erro ao autenticar. Tente novamente.');
          }
        } catch (err) {
          console.error('Login error:', err);
          showError('Erro de conectividade. Tente novamente.');
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Entrar';
        }
      });

      function showError(msg) {
        errorMessage.textContent = msg;
        errorMessage.style.display = 'block';
      }

      // Focus no password ao carregar
      passwordInput.focus();
    </script>
  </body>
</html>
